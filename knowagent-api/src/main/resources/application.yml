spring:
  application:
    name: knowagent-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/knowagent}
    username: ${POSTGRES_USER:knowagent}
    password: ${POSTGRES_PASSWORD:knowagent_dev}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${API_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Access-token (JWT) configuration. issuer/audience/secret are mandatory and
# come only from the environment - application.yml carries no real key. The
# secret must be base64-encoded and decode to at least 32 bytes (HS256). The
# API fails fast at startup until JWT_SECRET, JWT_ISSUER and JWT_AUDIENCE are set.
jwt:
  issuer: ${JWT_ISSUER:}
  audience: ${JWT_AUDIENCE:}
  secret: ${JWT_SECRET:}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

logging:
  level:
    root: INFO
    com.knowagent: INFO

