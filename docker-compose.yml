name: knowagent

x-app-environment: &app-environment
  POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowagent}
  POSTGRES_USER: ${POSTGRES_USER:-knowagent}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowagent_dev}
  REDIS_URL: redis://redis:6379
  WORKER_STREAM_GROUP: ${WORKER_STREAM_GROUP:-knowledge-file-ingestion}
  WORKER_STREAM_BATCH_SIZE: ${WORKER_STREAM_BATCH_SIZE:-20}
  WORKER_STREAM_POLL_TIMEOUT: ${WORKER_STREAM_POLL_TIMEOUT:-1s}
  WORKER_STREAM_RECLAIM_IDLE: ${WORKER_STREAM_RECLAIM_IDLE:-30s}
  WORKER_TASK_LEASE: ${WORKER_TASK_LEASE:-5m}
  WORKER_OUTBOX_LEASE: ${WORKER_OUTBOX_LEASE:-30s}
  WORKER_STREAM_POLL_DELAY_MS: ${WORKER_STREAM_POLL_DELAY_MS:-250}
  WORKER_STREAM_RECLAIM_DELAY_MS: ${WORKER_STREAM_RECLAIM_DELAY_MS:-5000}
  WORKER_OUTBOX_PUBLISHER_DELAY_MS: ${WORKER_OUTBOX_PUBLISHER_DELAY_MS:-1000}
  WORKER_OUTBOX_PUBLISHER_ENABLED: ${WORKER_OUTBOX_PUBLISHER_ENABLED:-true}
  WORKER_STREAM_CONSUMER_ENABLED: ${WORKER_STREAM_CONSUMER_ENABLED:-true}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-knowagent}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowagent_dev}
  MINIO_BUCKET: ${MINIO_BUCKET:-knowledge}
  PARSE_MAX_BYTES: ${PARSE_MAX_BYTES:-52428800}
  PARSE_MAX_PAGES: ${PARSE_MAX_PAGES:-1000}
  PARSE_MAX_UNCOMPRESSED_BYTES: ${PARSE_MAX_UNCOMPRESSED_BYTES:-536870912}
  PARSE_MAX_CHARACTERS: ${PARSE_MAX_CHARACTERS:-10000000}
  PARSE_TIMEOUT: ${PARSE_TIMEOUT:-60s}
  MILVUS_ENDPOINT: http://milvus:19530
  # Milvus collection contract for the vector-store adapter (提示词十六): fixed
  # collection name and embedding dimension. MILVUS_DIMENSION must match the
  # configured embedding model (1536 = text-embedding-3-small). A pre-existing
  # collection with a different schema/dimension refuses startup, never drops.
  MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_chunks}
  MILVUS_DIMENSION: ${MILVUS_DIMENSION:-1536}
  MILVUS_INDEX_TYPE: ${MILVUS_INDEX_TYPE:-HNSW}
  MILVUS_INDEX_M: ${MILVUS_INDEX_M:-16}
  MILVUS_INDEX_EF_CONSTRUCTION: ${MILVUS_INDEX_EF_CONSTRUCTION:-64}
  MILVUS_SEARCH_EF: ${MILVUS_SEARCH_EF:-64}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
  MINERU_BASE_URL: ${MINERU_BASE_URL:-http://host.docker.internal:30001}
  PADDLEX_BASE_URL: ${PADDLEX_BASE_URL:-http://host.docker.internal:8088}

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: knowagent-api:local
    environment:
      <<: *app-environment
      API_PORT: 8080
      MANAGEMENT_PORT: 8081
    ports:
      - "${API_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: knowagent-worker:local
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowagent}
      POSTGRES_USER: ${POSTGRES_USER:-knowagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowagent_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowagent} -d ${POSTGRES_DB:-knowagent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowagent_dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-knowagent}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-knowagent_dev}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26
    profiles: ["full"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/knowagent_dev}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  neo4j_data:
